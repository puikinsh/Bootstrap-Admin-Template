version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Batch the routine churn into a few PRs instead of one per package, so the
    # ones that actually need review (majors, runtime deps) stand out.
    groups:
      build-tooling:
        patterns:
          - vite
          - sass
          - postcss
          - autoprefixer
          - rimraf
        update-types:
          - minor
          - patch
      linting:
        patterns:
          - eslint
          - '@eslint/*'
          - prettier
          - globals
        update-types:
          - minor
          - patch
      runtime:
        patterns:
          - bootstrap
          - bootstrap-icons
          - alpinejs
          - chart.js
          - chartjs-*
          - sweetalert2
          - prismjs
          - '@popperjs/core'
          - '@fontsource-variable/*'
        update-types:
          - minor
          - patch
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
      prefix-development: 'deps-dev'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: 'ci'
